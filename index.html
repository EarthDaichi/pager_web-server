<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMITL ESP32 Pager Web Page</title>

    <!-- Bootstrap & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ไฟล์ CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-kmitl mb-4">  
        <div class="container py-1">
            <span class="navbar-brand mb-0 h1 fw-bold text-white d-flex align-items-center gap-2">
                <i class="fa-solid fa-pager fs-4"></i> KMITL ESP32 PAGER WEB PAGE
            </span>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        
        <!-- ฟอร์มส่งข้อความ -->
        <div class="card card-custom p-4 mb-4">
            <h5 class="fw-bold mb-3 text-dark d-flex align-items-center gap-2">
                <i class="fa-regular fa-paper-plane text-warning"></i> ส่งข้อความเข้าเครื่อง Pager
            </h5>
            
            <form id="pagerForm">
                <!-- 1. ข้อความ -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">ข้อความที่ต้องการส่ง:</label>
                    <textarea id="messageInput" name="message" class="form-control" rows="3" placeholder="พิมพ์ข้อความที่ต้องการส่งออกอากาศ..." required></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <!-- 2. รูปแบบการส่ง -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">เลือกผู้รับ:</label>
                        <select id="sendModeSelect" name="send_mode" class="form-select" required>
                            <option value="1_TO_1">ส่งเฉพาะรายบุคคล (1:1)</option>
                            <option value="1_TO_SOME">ส่งหลายคน (1:N)</option>
                            <option value="1_TO_ALL">ส่งหาทุกคน (1:ALL)</option>
                        </select>
                    </div>

                    <!-- 3. รหัสเครื่องปลายทาง -->
                    <div id="targetContainer" class="col-md-6 animated-box">
                        <label class="form-label fw-semibold">เลือกเครื่องปลายทาง:</label>
                        <!-- 3. รหัสเครื่องปลายทาง -->
                        <select id="targetIdSelect" name="target_id" class="form-select">
                            <option value="PAG-01">เครื่องที่ 1 (PAG-01)</option>
                            <option value="PAG-02">เครื่องที่ 2 (PAG-02)</option>
                            <option value="PAG-03">เครื่องที่ 3 (PAG-03)</option>
                            <option value="OTHER">อื่นๆ (ระบุเอง)</option>
                        </select>
                        <div class="checkboxDropdown">
                            <button type="submit" class="checkboxDropdownButton">เลือกเครื่อง</button>
                            <div class="checkbox-dropdown-menu" id="checkboxDropdownMenu">
                            <!-- 3.2 รหัสเครื่องปลายทางSome -->
                                <label><input type="checkbox" name="target_id" value="PG-01">PAG-01</label>
                                <label><input type="checkbox" name="target_id" value="PG-02">PAG-02</label>
                                <label><input type="checkbox" name="target_id" value="PG-03">PAG-03</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ช่องพิมพ์ระบุเอง -->
                <div id="customTargetContainer" class="mb-3 animated-box hidden">
                    <label class="form-label fw-semibold text-primary">ระบุรหัสเครื่องเอง:</label>
                    <input type="text" id="customTargetInput" name="custom_target_id" class="form-control" placeholder="พิมพ์รหัส เช่น PAG-99">
                </div>

                <!-- ปุ่มส่งข้อความ -->
                <button type="submit" id="submitBtn" class="btn btn-kmitl w-100 fs-6 mt-2">
                    <i class="fa-solid fa-satellite-dish me-2"></i> ส่งข้อความ
                </button>
            </form>
        </div>

    </div>

    <!-- ไฟล์ JavaScript -->
    <script src="script.js"></script>
</body>
</html>
